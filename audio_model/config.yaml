defaults:
  - base

device: "cuda"

model:
  name: "wav2vec2"
  pretrained_model: "facebook/wav2vec2-base"
  freeze_encoder: true
  freeze_last_n: 4
  hidden_dim: 256
  dropout: 0.1
  target_samples: 64000
  class_weights: [3.0, 1.0]

training:
  batch_size: 8
  learning_rate: 0.00001
  weight_decay: 0.0001
  epochs: 40
  lr_scheduler: "cosine"
  gradient_clip_norm: 1.0
  early_stopping_patience: 12
  checkpoint_dir: "checkpoints/wav2vec2_improved"
